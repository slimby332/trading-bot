[project]
name = "tradebot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Slim", email = "12345678+username@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alpaca-py>=0.44.0",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
tradebot = "tradebot:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
